name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
      - "docs/feed*.xml"
      - "state/**"
      - "reports/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests with coverage
        run: pytest --cov=pkgwatch --cov-report=term-missing --cov-fail-under=85

      - name: Detector evaluation (recall and false-positive gates)
        run: python -m pkgwatch.eval

      - name: Fixtures are in sync with their generator
        run: |
          python scripts/build_fixtures.py
          git diff --exit-code -- tests/fixtures

      - name: Dashboard and workflow sanity checks
        run: python scripts/check_site.py
