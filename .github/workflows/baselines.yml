name: Refresh baselines

# Weekly refresh of the popular-package lists that typosquats are compared against.

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baselines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      # Fails (and leaves the committed snapshot alone) if a list comes back
      # unreachable or implausibly small.
      - name: Refresh popular-package lists
        run: python -m pkgwatch.sources.baselines

      - name: Commit changed baselines
        run: |
          git config user.name "pkgwatch-bot"
          git config user.email "pkgwatch-bot@users.noreply.github.com"
          git add -A data/baselines
          if git diff --cached --quiet; then
            echo "Baselines unchanged; no commit."
            exit 0
          fi
          git commit -q -m "data: refresh popular-package baselines"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; }
            sleep $((attempt * 5))
          done
          echo "::error::Could not push refreshed baselines after 3 attempts."
          exit 1
